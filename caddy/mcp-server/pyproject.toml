[project]
name = "khc-image-mcp"
version = "3.2.0"
description = "多模态图片 MCP 服务：生图、修图、OCR 识图、搜图"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27.0,<1.0.0",
    "starlette>=0.30.0",
    "uvicorn>=0.25.0",
    "pydantic>=2.6",
    "ddgs>=9.0.0",
    "rapidocr_onnxruntime>=1.3.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
rembg = ["rembg>=2.0.50", "onnxruntime>=1.17"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["scripts", "static", "templates"]

[tool.ruff.lint]
select = ["F", "E9", "B006", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
