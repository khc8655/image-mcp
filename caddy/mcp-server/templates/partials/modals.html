<!-- 挂载模型弹窗 (生图 / 识图 统一挂载面板) -->
<div class="modal-overlay" id="bindModelModal" onclick="if(event.target===this)closeModal('bindModelModal')">
  <div class="modal-dialog">
    <div class="modal-header">
      <h3 id="bindModalTitle">挂载模型</h3>
      <button class="modal-close" type="button" onclick="closeModal('bindModelModal')">
        <svg class="icon"><use href="#icon-close"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="bind_target_type" value="generation">
      <input type="hidden" id="bind_selected_model" value="">
      
      <div class="form-field">
        <label>1. 选择厂商</label>
        <select id="bind_provider_select" onchange="onBindProviderChange()"></select>
      </div>

      <div class="form-field" style="margin-top:14px;">
        <label id="bind_model_label">2. 选择模型 (点击单选)</label>
        <div id="bind_model_cards" class="capsule-list" style="display:flex;flex-direction:column;gap:8px;max-height:200px;overflow-y:auto;margin-top:6px;"></div>
        <input type="text" id="bind_custom_model" class="mono-text" style="margin-top:8px;" placeholder="或手动填写模型 ID（填了就以这里为准），如 gemini-nano-banana-2.1">
      </div>

      <div class="form-field" id="bind_role_field" style="margin-top:14px;">
        <label id="bind_role_label">3. 偏好角色标签</label>
        <select id="bind_role_select"></select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" type="button" onclick="closeModal('bindModelModal')">取消</button>
      <button class="btn btn-primary" type="button" id="btnConfirmBindModel" onclick="confirmBindModel()">确定挂载</button>
    </div>
  </div>
</div>

<!-- 编辑模型弹窗 (编辑角色与高级参数) -->
<div class="modal-overlay" id="editModelModal" onclick="if(event.target===this)closeModal('editModelModal')">
  <div class="modal-dialog">
    <div class="modal-header">
      <h3 id="editModalTitle">编辑模型配置</h3>
      <button class="modal-close" type="button" onclick="closeModal('editModelModal')">
        <svg class="icon"><use href="#icon-close"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="edit_target_type" value="generation">
      <input type="hidden" id="edit_model_index" value="-1">
      
      <div class="form-grid-2">
        <div class="form-field">
          <label>模型 ID</label>
          <input type="text" id="edit_model_id" class="mono-text font-bold" style="color:var(--color-primary);" title="可直接改成上游实际的模型 ID">
        </div>
        <div class="form-field">
          <label>所属厂商</label>
          <input type="text" id="edit_model_provider" readonly style="background:var(--color-bg-page);">
        </div>
      </div>

      <div class="form-field" style="margin-top:12px;">
        <label>偏好角色</label>
        <select id="edit_role_select"></select>
      </div>

      <!-- 高级参数区域 (针对特定厂商动态显示) -->
      <div id="editAdvancedSection" style="display:none;margin-top:16px;padding-top:14px;border-top:1px dashed var(--color-border);">
        <label class="font-bold" style="font-size:13px;display:block;margin-bottom:8px;">高级控制参数 (可选)</label>
        
        <!-- MiniMax 专属参数 -->
        <div id="editAdvMinimax" style="display:none;display:flex;flex-direction:column;gap:8px;">
          <div class="form-field">
            <label style="font-size:12px;">官方 Prompt 优化器</label>
            <select id="adv_minimax_optimizer">
              <option value="auto" selected>auto — 提示词很短时才开（推荐，Agent 写的长描述不被改写）</option>
              <option value="on">始终开启</option>
              <option value="off">始终关闭</option>
            </select>
          </div>
          <label style="display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;">
            <input type="checkbox" id="adv_minimax_watermark">
            <span>官方 AIGC 水印</span>
          </label>
        </div>

        <!-- FLUX / Agnes 专属参数 -->
        <div id="editAdvAgnes" style="display:none;display:flex;flex-direction:column;gap:8px;">
          <div class="form-field">
            <label style="font-size:12px;">分辨率档位（Agent 与后台默认都没给时使用）</label>
            <select id="adv_agnes_size">
              <option value="1K">1K</option>
              <option value="2K" selected>2K</option>
              <option value="3K">3K</option>
              <option value="4K">4K</option>
            </select>
          </div>
        </div>

        <!-- Google Imagen / Gemini 专属参数 -->
        <div id="editAdvGoogle" style="display:none;display:flex;flex-direction:column;gap:8px;">
          <div class="form-field">
            <label style="font-size:12px;">默认输出分辨率 (Gemini 3 Pro 原生)</label>
            <select id="adv_google_image_size">
              <option value="auto">auto (模型自适应)</option>
              <option value="1K">1K (标准 1024)</option>
              <option value="2K" selected>2K (超清 2048)</option>
              <option value="4K">4K (极致 4096)</option>
            </select>
          </div>
          <div class="form-field">
            <label style="font-size:12px;">人像生成控制 (Person Generation)</label>
            <select id="adv_google_person">
              <option value="ALLOW_ADULT" selected>ALLOW_ADULT (允许成年人人像)</option>
              <option value="DONT_ALLOW">DONT_ALLOW (禁止人像生成)</option>
              <option value="ALLOW_ALL">ALLOW_ALL (允许所有人像)</option>
            </select>
          </div>
          <div class="form-field">
            <label style="font-size:12px;">思考档位</label>
            <select id="adv_google_thinking">
              <option value="" selected>默认 — 仅 quality=best 时开启 high</option>
              <option value="minimal">minimal — 始终最快</option>
              <option value="high">high — 始终深度思考（慢，复杂图表更准）</option>
            </select>
          </div>
          <label style="display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;">
            <input type="checkbox" id="adv_google_image_search">
            <span>搜索接地时同时用 Google 图片搜索（Nano Banana 2 / 2.1）</span>
          </label>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" type="button" onclick="closeModal('editModelModal')">取消</button>
      <button class="btn btn-primary" type="button" id="btnConfirmEditModel" onclick="confirmEditModel()">保存修改</button>
    </div>
  </div>
</div>
